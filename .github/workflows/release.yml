name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - name: Prepare Linux desktop test prerequisites
        run: |
          mkdir -p /tmp/opencode
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0t64 libnss3 libgbm1 libasound2t64 apparmor xvfb xauth
      - name: Scan source and history for secrets
        run: |
          curl --proto '=https' --tlsv1.2 -fLsS --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
      - name: Install development runtimes
        run: |
          npm ci
          npm exec -- install-electron --no
      - name: Check syntax and shell scripts
        run: |
          for file in *.mjs desktop/*.mjs desktop/*.cjs scripts/*.mjs tests/*.mjs; do node --check "$file"; done
          for file in scripts/*.sh tests/fixtures/*.sh; do sh -n "$file"; done
      - name: Test offline call lifecycle and file tools
        run: npm test
      - name: Configure the sandbox on this disposable runner
        run: sh scripts/setup-sandbox.sh "$PWD/node_modules/electron/dist/electron"
      - name: Test the sandboxed desktop
        run: xvfb-run -a npm run test:desktop

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - name: Prepare Linux desktop test prerequisites
        run: |
          mkdir -p /tmp/opencode
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0t64 libnss3 libgbm1 libasound2t64 apparmor xvfb xauth
      - name: Build portable Linux archive and checksums
        run: |
          npm ci
          npm exec -- install-electron --no
          npm run build:release
          cd dist
          sha256sum -c SHA256SUMS
      - name: Test installation and the actual shipped desktop
        env:
          VOICE_CALL_SMOKE_GUI: "1"
        run: xvfb-run -a npm run test:release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if grep -qx false "$RUNNER_TEMP/release-draft"; then
              echo "Release is already published; keeping its immutable assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Voice Call $RELEASE_TAG" --notes-file RELEASE.md
          fi
          gh release upload "$RELEASE_TAG" dist/voice-call-x86_64-unknown-linux-gnu.tar.xz dist/voice-call-installer.sh dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
